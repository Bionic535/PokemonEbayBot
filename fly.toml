# fly.toml app configuration file generated for pokemonebaybot on 2026-11-20T10:16:22+08:00
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'pokemonebaybot'
primary_region = 'syd'

[build]
[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpus = 1
